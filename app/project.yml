name: SportingMomentsClock

options:
  bundleIdPrefix: AG
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The one place for the version and the bundle identifier. AppIdentity.swift repeats
    # APP_BUNDLE_ID for the Swift code, and a test checks the two agree.
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    APP_BUNDLE_ID: AG.SportingMomentsClock
    # Ad hoc signing: no developer account needed to build and run locally.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # dist/make_release.sh signs the release with Developer ID and the hardened runtime.
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    # The credits script reads data/overrides/images.csv, outside the project folder.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# The data, photos and fonts. Both are folder references, so whatever the data pipeline
# and the images agent drop into them is bundled on the next build without regenerating
# the project:
#   <bundle>/Contents/Resources/Resources/moments.json, sample_moments.json, credits.json, images/
#   <bundle>/Contents/Resources/Fonts/*.ttf and the OFL licence texts
# credits.json is written before each build from data/overrides/images.csv by Tools/make_credits.py.
# The screen saver and the tests carry them. The app does not: it reads them from the
# saver embedded inside it, so each file ships once.
targetTemplates:
  BundlesMomentResources:
    preBuildScripts:
      - name: Write credits.json
        script: python3 "$SRCROOT/Tools/make_credits.py"
        basedOnDependencyAnalysis: false
        showEnvVars: false
    sources:
      - path: Resources
        type: folder
        buildPhase: resources
      - path: Fonts
        type: folder
        buildPhase: resources

targets:
  # Shared code: model, store, picker, clock and the SwiftUI card. Built as a
  # static framework so each product links its own copy and the .saver stays
  # self contained (legacyScreenSaver loads it into a foreign process).
  MomentsCore:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/MomentsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  SportingMomentsClock:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    dependencies:
      - target: MomentsCore
        embed: false
      - sdk: ScreenSaver.framework
      # The screen saver travels inside the app (Contents/Resources/SportingMomentsClock.saver),
      # so the app is the one thing to hand over. Settings > Screen Saver installs it, and the
      # app loads its own moments, photos and fonts from it.
      - target: SportingMomentsSaver
        embed: true
        codeSign: true
        copy:
          destination: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Sporting Moments Clock
        CFBundleName: Sporting Moments Clock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 AnuGnane
    settings:
      base:
        PRODUCT_NAME: SportingMomentsClock
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ENABLE_APP_SANDBOX: NO

  SportingMomentsSaver:
    type: bundle
    platform: macOS
    templates: [BundlesMomentResources]
    sources:
      - path: Sources/Saver
    dependencies:
      - target: MomentsCore
        embed: false
      - sdk: ScreenSaver.framework
    info:
      path: Sources/Saver/Info.plist
      properties:
        # Without it codesign seals the binary as a plain resource and SaverInstaller cannot fingerprint it.
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleDisplayName: Sporting Moments Clock
        CFBundleName: Sporting Moments Clock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: SportingMomentsSaverView
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 AnuGnane
    settings:
      base:
        PRODUCT_NAME: SportingMomentsClock
        PRODUCT_MODULE_NAME: SportingMomentsSaver
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).saver
        WRAPPER_EXTENSION: saver

  MomentsCoreTests:
    type: bundle.unit-test
    platform: macOS
    templates: [BundlesMomentResources]
    sources:
      - path: Tests/MomentsCoreTests
    dependencies:
      # No ScreenSaver.framework here: it pulls Photos and Contacts into the test runner,
      # which then logs address book and Core Data errors.
      - target: MomentsCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SportingMomentsClock:
    build:
      targets:
        SportingMomentsClock: all
        MomentsCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MomentsCoreTests
  SportingMomentsSaver:
    build:
      targets:
        SportingMomentsSaver: all
    run:
      config: Debug
